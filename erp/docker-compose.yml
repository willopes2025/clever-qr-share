services:
  postgres:
    image: postgres:16-alpine
    container_name: soul-erp-db
    environment:
      POSTGRES_USER: soul
      POSTGRES_PASSWORD: soul
      POSTGRES_DB: soul_erp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soul -d soul_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: soul-erp-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
